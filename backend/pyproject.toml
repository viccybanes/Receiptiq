[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptiq"
version = "0.1.0"
description = "Local receipt OCR, human verification, and batch CSV export"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20",
  "pydantic==2.11.5", "Pillow==11.2.1", "pypdfium2==4.30.0",
  "opencv-contrib-python==4.10.0.84", "numpy==1.26.4",
  "paddleocr==3.0.3", "paddlex==3.0.3", "paddlepaddle==3.0.0",
  # PaddleX 3.0 eagerly imports legacy LangChain modules even in its OCR pipeline.
  "langchain==0.3.25", "langchain-community==0.3.24", "langchain-openai==0.3.18",
  "langchain-core==0.3.63", "openai==1.82.1", "filelock==3.18.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.13", "pyinstaller==6.14.1", "psutil==7.0.0"]

[project.scripts]
receiptiq = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
